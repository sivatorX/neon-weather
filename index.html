<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Погода</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="background.css">
  <script src="background.js" defer></script>
  <script src="insights.js" defer></script>
  <script src="storage.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <header>
      <h1>Погода</h1>
      <!-- Today's date; app.js fills it -->
      <p id="header-date" class="header-date"></p>
    </header>

    <form id="search-form" class="search-form">
      <label for="city-input">Город</label>
      <input id="city-input" type="search" placeholder="Например, Москва" autocomplete="off" autocapitalize="words" enterkeyhint="search">
      <button type="submit">Найти</button>
    </form>

    <!-- Uses the GPS of the device; app.js hides it if the browser cannot do that -->
    <button id="locate-button" class="locate-button" type="button">📍 Моё место</button>

    <!-- Favourite cities as chips; app.js fills it (empty = hidden) -->
    <div id="favourites" class="favourites" aria-label="Избранное"></div>

    <!-- Messages (loading, errors) will appear here -->
    <p id="status" role="status" aria-live="polite">Введите город, чтобы узнать погоду</p>

    <!-- If several cities match the name, app.js shows buttons here -->
    <div id="city-choices" class="city-choices"></div>

    <!-- The weather card is built by app.js after a search -->
    <section id="today" aria-label="Сейчас"></section>

    <!-- Assistant: advice built by insights.js, drawn by app.js -->
    <section id="assistant" aria-label="Помощник"></section>

    <!-- Next hours: filled in a later step -->
    <section id="hourly" aria-label="Ближайшие часы"></section>

    <!-- 7-day forecast: filled in a later step -->
    <section id="daily" aria-label="Прогноз на 7 дней"></section>
  </main>

</body>
</html>
