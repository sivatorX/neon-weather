<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Погода</title>
  <style>
    /* Colors live in variables, so dark mode only has to change them here */
    :root {
      --bg: #eef4fb;
      --card: #ffffff;
      --text: #1b2733;
      --muted: #526373;
      --accent: #1a63d6;
      --accent-text: #ffffff;
      --border: #cdd9e5;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11181f;
        --card: #1c2630;
        --text: #e8eef4;
        --muted: #93a4b3;
        --accent: #4d94ff;
        --accent-text: #0b1118;
        --border: #34424f;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
    }

    /* One centered column; 16px gutter keeps text off the screen edge on phones */
    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    h1 {
      margin: 8px 0 16px;
      font-size: 28px;
    }

    .search-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .search-form label {
      width: 100%;
      font-size: 14px;
      color: var(--muted);
    }

    /* min-width: 0 lets the input shrink, so the page never scrolls sideways */
    .search-form input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      padding: 0 12px;
      font-size: 16px;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .search-form button {
      min-height: 48px;
      padding: 0 20px;
      font-size: 16px;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* A clear ring shows where the keyboard focus is (also visible in dark mode) */
    .search-form input:focus-visible,
    .search-form button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    /* Step 2 will disable the button while the weather is loading */
    .search-form button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #status {
      margin: 16px 0;
      color: var(--muted);
    }

    section {
      margin-bottom: 16px;
    }

    .card {
      padding: 24px 16px;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .card-city {
      margin: 0;
      font-size: 20px;
      /* Very long city names wrap instead of pushing the page sideways */
      overflow-wrap: anywhere;
    }

    .card-icon {
      font-size: 64px;
      line-height: 1.2;
    }

    .card-temp {
      font-size: 56px;
      font-weight: 700;
    }

    .card-text {
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Погода</h1>
    </header>

    <form id="search-form" class="search-form">
      <label for="city-input">Город</label>
      <input id="city-input" type="search" placeholder="Например, Москва" autocomplete="off" autocapitalize="words" enterkeyhint="search">
      <button type="submit">Найти</button>
    </form>

    <!-- Messages (loading, errors) will appear here -->
    <p id="status" role="status" aria-live="polite">Введите город, чтобы узнать погоду</p>

    <section id="today" aria-label="Сейчас">
      <!-- DEMO DATA: static card, will be replaced by real API data in step 2 -->
      <div class="card">
        <h2 class="card-city">Москва</h2>
        <div class="card-icon" aria-hidden="true">☀️</div>
        <div class="card-temp">12°</div>
        <div class="card-text">Ясно</div>
      </div>
    </section>

    <!-- Next hours: filled in a later step -->
    <section id="hourly" aria-label="Ближайшие часы"></section>

    <!-- 7-day forecast: filled in a later step -->
    <section id="daily" aria-label="Прогноз на 7 дней"></section>
  </main>

  <!-- JavaScript comes in step 2 -->
</body>
</html>
